name: Contribution snake

# Genera la serpiente animada a partir de las contribuciones públicas del perfil
# y la publica en la rama "output". No usa tokens ni secretos propios.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#5b5bd6&color_dots=#ebebf5,#d5d5ff,#b0b0ff,#7c7cff,#5050e0
            dist/snake-dark.svg?color_snake=#b4b4ff&color_dots=#161618,#32325e,#4d4d99,#7c7cff,#b4b4ff

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update contribution snake"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" output
